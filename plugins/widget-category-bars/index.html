<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --fg:#ddd; --mute:#888; --line:#2a2a2a; color-scheme: dark; }
  :root[data-theme="light"] { --fg:#1c1c1e; --mute:#6b6b70; --line:#dcdce0; color-scheme: light; }
  html, body { height:100%; }
  body { margin:0; padding:6px 10px 4px; font: 11px/1.3 "Segoe UI Variable", "Segoe UI", sans-serif; color:var(--fg); background:transparent; display:flex; flex-direction:column; }
  svg { flex:1; min-height:0; width:100%; }
  text { fill: var(--mute); font-size:10px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; color:var(--mute); padding-top:4px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .mute { color:var(--mute); }
</style></head>
<body><div id="root" class="mute">불러오는 중…</div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 시간대별 분류 막대(ActivityWatch Timeline barchart). 한 시간마다 최상위 분류별로 쌓는다. y축 0~60분.
const S = LifeLogSdk;
async function q(view, opts) { try { return (await lifelog.query(view, opts)).rows; } catch (e) { return []; } }
lifelog.ready(async (range, widget) => {
  const st = widget.settings || {};
  const root = document.getElementById("root");
  const [win, afk, app, settings] = await Promise.all([q("win-window/window", { range, limit: 20000 }), q("win-afk/afk", { range, limit: 5000 }), q("phone-app/app", { range, limit: 20000 }), lifelog.settings()]);
  const entries = S.categorize({ win, afk, app, range, devices: st.devices || [], pcRules: settings.categories || [], phRules: settings.phone_categories || [] });
  if (entries.length === 0) { root.textContent = "기록 없음"; return; }
  // 시간 버킷 × 분류
  const S0 = S.ms(range.start), E0 = S.ms(range.end), hours = Math.round((E0 - S0) / 3600e3);
  const cats = new Map();   // 가장 아래 분류(path) → [ms per hour]
  for (const en of entries) {
    const arr = cats.get(en.path) || new Array(hours).fill(0);
    for (let h = 0; h < hours; h++) { const a = Math.max(S0 + h * 3600e3, en.s), b = Math.min(S0 + (h + 1) * 3600e3, en.e); if (b > a) arr[h] += b - a; }
    cats.set(en.path, arr);
  }
  const order = [...cats.entries()].sort((a, b) => b[1].reduce((x, y) => x + y, 0) - a[1].reduce((x, y) => x + y, 0));
  // 그리기
  const W = 600, H = 220, L = 34, B = 18, T = 6, plotW = W - L - 6, plotH = H - B - T, bw = plotW / hours;
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (const m of [0, 15, 30, 45, 60]) { const y = T + plotH - m / 60 * plotH; svg += `<line x1="${L}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">${m === 60 ? "1h" : m + "m"}</text>`; }
  for (let h = 0; h < hours; h++) {
    let y = T + plotH;
    for (const [top, arr] of order) {
      const hgt = Math.min(1, arr[h] / 3600e3) * plotH; if (hgt <= 0) continue;
      y -= hgt;
      svg += `<rect x="${L + h * bw + 1}" y="${y}" width="${Math.max(1, bw - 2)}" height="${hgt}" fill="${S.categoryColor(top)}"><title>${S.esc(S.fmtTime(S0 + h * 3600e3))}  ${S.esc(top)}  ${S.fmtDur(arr[h])}</title></rect>`;
    }
    if (h % 2 === 0) svg += `<text x="${L + h * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${new Date(S0 + h * 3600e3).getHours()}</text>`;
  }
  svg += "</svg>";
  root.className = ""; root.innerHTML = svg + `<div class="legend">${order.map(([top, arr]) => `<span title="${S.esc(top)}"><i style="background:${S.categoryColor(top)}"></i>${S.esc(S.leafName(top))} ${S.fmtDur(arr.reduce((x, y) => x + y, 0))}</span>`).join("")}</div>`;
  document.body.appendChild(root);
});
</script></body></html>

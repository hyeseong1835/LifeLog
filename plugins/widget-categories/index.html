<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --fg:#ddd; --mute:#888; --dur:#aaa; --bar-fg:#000; color-scheme: dark; }
  :root[data-theme="light"] { --fg:#1c1c1e; --mute:#6b6b70; --dur:#555; color-scheme: light; }
  body { margin:0; padding:6px 12px 8px; font: 12px/1.4 "Segoe UI Variable", "Segoe UI", sans-serif; color:var(--fg); background:transparent; }
  .row { display:grid; grid-template-columns: 1fr 70px; align-items:center; gap:8px; margin:3px 0; }
  .bar { height:16px; border-radius:3px; display:flex; align-items:center; padding:0 5px; color:var(--bar-fg); font-size:11px; white-space:nowrap; overflow:hidden; min-width:2px; }
  .dur { text-align:right; color:var(--dur); font-variant-numeric: tabular-nums; }
  .mute { color:var(--mute); }
  .src { display:inline-block; margin-left:4px; font-size:10px; opacity:.7; }
</style></head>
<body><div id="root" class="mute">불러오는 중…</div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 분류별 시간. 설정 devices로 포함할 기기를 고른다(비우면 전부). 기기마다 데이터 종류에 맞는 규칙을 쓴다:
// 창 기록(win-window)이 있는 기기는 컴퓨터 규칙(app·title), 앱 기록(phone-app)이 있는 기기는 휴대폰 규칙(package). 결과는 한 목록으로 합친다.
const S = LifeLogSdk;
async function q(view, opts) { try { return (await lifelog.query(view, opts)).rows; } catch (e) { return []; } }
lifelog.ready(async (range, widget) => {
  const st = widget.settings || {}; const limit = Number(st.limit) || 12;
  const devices = Array.isArray(st.devices) ? st.devices : [];
  const include = d => devices.length === 0 || devices.includes(d);
  const root = document.getElementById("root");
  const [win, afk, app, settings] = await Promise.all([q("win-window/window", { range, limit: 20000 }), q("win-afk/afk", { range, limit: 5000 }), q("phone-app/app", { range, limit: 20000 }), lifelog.settings()]);
  const entries = S.categorize({ win, afk, app, range, devices, pcRules: settings.categories || [], phRules: settings.phone_categories || [] });
  // 가장 아래 분류(규칙 이름 그대로)별 합계. "개발/VSCode"는 VSCode로 보여 준다
  const sums = new Map(); let n = entries.length, missingRules = [];
  for (const en of entries) sums.set(en.path, (sums.get(en.path) || 0) + (en.e - en.s));
  if (entries.some(en => !en.app.startsWith("📱")) && !(settings.categories || []).length) missingRules.push("컴퓨터");
  if (entries.some(en => en.app.startsWith("📱")) && !(settings.phone_categories || []).length) missingRules.push("휴대폰");
  const pcDevices = [...new Set(entries.filter(en => !en.app.startsWith("📱")).map(en => en.device))], phDevices = [...new Set(entries.filter(en => en.app.startsWith("📱")).map(en => en.device))];
  if (n === 0) { root.className = "mute"; root.innerHTML = "기록 없음" + (devices.length ? ` (${devices.join(", ")})` : ""); return; }
  const groups = [...sums.entries()].map(([key, ms]) => ({ key, ms })).sort((a, b) => b.ms - a.ms);
  const max = groups[0].ms;
  root.className = "";
  root.innerHTML = groups.slice(0, limit).map(g => `<div class="row" title="${S.esc(g.key)}">
    <div class="bar" style="width:${Math.max(2, g.ms / max * 100)}%;background:${S.categoryColor(g.key)}">${S.esc(S.leafName(g.key))}</div><div class="dur">${S.fmtDur(g.ms)}</div></div>`).join("") +
    `<div class="mute" style="margin-top:6px">${[...pcDevices, ...phDevices].join(", ")}${missingRules.length ? ` · ${[...new Set(missingRules)].join("·")} 규칙 없음(설정)` : ""}</div>`;
});
</script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --fg:#ddd; --mute:#888; --line:#2a2a2a; --tile:#1f1f22; color-scheme: dark; }
  :root[data-theme="light"] { --fg:#1c1c1e; --mute:#6b6b70; --line:#dcdce0; --tile:#f2f2f5; color-scheme: light; }
  html, body { height:100%; }
  body { margin:0; padding:8px 12px 6px; font: 11px/1.3 "Segoe UI Variable", "Segoe UI", sans-serif; color:var(--fg); background:transparent; overflow:hidden; box-sizing:border-box; }
  #root { display:flex; flex-direction:column; height:100%; gap:4px; }
  #root.msg { display:block; color:var(--mute); }
  .head { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; flex:none; }
  .head b { font-size:22px; font-weight:600; }
  .head .u { font-size:11px; color:var(--mute); margin-left:2px; font-weight:400; }
  .mute { color:var(--mute); }
  .chart { flex:1; min-height:40px; position:relative; }
  .chart svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  text { fill:var(--mute); font-size:10px; }
  .list { overflow:auto; flex:1; min-height:0; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-top:1px solid var(--line); }
  .row .r { text-align:right; white-space:nowrap; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:6px; }
  .tile { background:var(--tile); border-radius:8px; padding:6px 8px; }
  .tile .k { color:var(--mute); font-size:10px; }
  .tile .v { font-size:16px; font-weight:600; }
  .tile .v small { font-size:10px; font-weight:400; color:var(--mute); margin-left:2px; }
  .tile .s { color:var(--mute); font-size:10px; }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; flex:none; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
</style></head>
<body><div id="root" class="msg">불러오는 중…</div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 운동 기록. 이 하루 범위의 운동(Health Connect exercise, 삼성 헬스 SDK sh_exercise): 시각·종류·시간·칼로리·거리.
// 같은 운동이 두 출처에 다 있으면(시작이 5분 안) SDK 쪽을 쓴다(칼로리·거리가 있다).
const S = LifeLogSdk, C = S.chart;
const $root = document.getElementById("root");
const msg = (t, sub) => { $root.className = "msg"; $root.innerHTML = S.esc(t) + (sub ? `<br><span class="mute">${S.esc(sub)}</span>` : ""); };
const own = (rows, st) => st.device ? rows.filter(r => r.device === st.device) : rows;
const q = async (view, opts) => (await lifelog.query(view, opts)).rows;
const r1 = x => Math.round(x * 10) / 10;
const num = x => Math.round(x).toLocaleString("ko-KR");
const layout = (parts) => { $root.className = ""; $root.innerHTML = parts; };
const KIND = { walking: "걷기", running: "달리기", cycling: "자전거", hiking: "등산", swimming: "수영", other: "기타", other_workout: "기타 운동", yoga: "요가", stretching: "스트레칭", strength_training: "근력 운동", weightlifting: "웨이트" };
lifelog.ready(async (range, widget) => {
  const st = widget.settings || {};
  let rows;
  try { rows = own(await q("health/span", { range, where: { metric: ["exercise", "sh_exercise"] }, limit: 500 }), st); }
  catch (e) { return msg("읽기 실패: " + e.message); }
  const sh = rows.filter(r => r.metric === "sh_exercise");
  const list = sh.concat(rows.filter(r => r.metric === "exercise" && !sh.some(x => Math.abs(S.ms(x.start) - S.ms(r.start)) < 5 * 60e3))).sort((a, b) => S.ms(a.start) - S.ms(b.start));
  if (!list.length) return msg("운동 기록 없음");
  const total = list.reduce((a, r) => a + S.ms(r.end) - S.ms(r.start), 0);
  layout('<div class="head"></div><div class="list"></div>');
  $root.querySelector(".head").innerHTML = `<b>${list.length}</b><span class="u">회</span><span class="mute">합계 ${S.fmtDur(total)}</span>`;
  $root.querySelector(".list").innerHTML = list.map(r => {
    const x = S.extraOf(r), name = KIND[String(r.category || "").toLowerCase()] || r.category || x.type || "운동";
    const kcal = r.metric === "sh_exercise" && r.value != null ? `${num(r.value)}kcal` : "";
    const km = x.distance_m ? ` · ${r1(x.distance_m / 1000)}km` : "";
    return `<div class="row"><span>${S.esc(name)}<br><span class="mute">${S.fmtTime(r.start)}~${S.fmtTime(r.end)}</span></span><span class="r">${S.fmtDur(S.ms(r.end) - S.ms(r.start))}<br><span class="mute">${kcal}${km}</span></span></div>`;
  }).join("");
});
</script></body></html>

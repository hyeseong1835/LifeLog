<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --fg:#ddd; --mute:#888; --line:#2a2a2a; --tile:#1f1f22; color-scheme: dark; }
  :root[data-theme="light"] { --fg:#1c1c1e; --mute:#6b6b70; --line:#dcdce0; --tile:#f2f2f5; color-scheme: light; }
  html, body { height:100%; }
  body { margin:0; padding:8px 12px 6px; font: 11px/1.3 "Segoe UI Variable", "Segoe UI", sans-serif; color:var(--fg); background:transparent; overflow:hidden; box-sizing:border-box; }
  #root { display:flex; flex-direction:column; height:100%; gap:4px; }
  #root.msg { display:block; color:var(--mute); }
  .head { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; flex:none; }
  .head b { font-size:22px; font-weight:600; }
  .head .u { font-size:11px; color:var(--mute); margin-left:2px; font-weight:400; }
  .mute { color:var(--mute); }
  .chart { flex:1; min-height:40px; position:relative; }
  .chart svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  text { fill:var(--mute); font-size:10px; }
  .list { overflow:auto; flex:1; min-height:0; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-top:1px solid var(--line); }
  .row .r { text-align:right; white-space:nowrap; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:6px; }
  .tile { background:var(--tile); border-radius:8px; padding:6px 8px; }
  .tile .k { color:var(--mute); font-size:10px; }
  .tile .v { font-size:16px; font-weight:600; }
  .tile .v small { font-size:10px; font-weight:400; color:var(--mute); margin-left:2px; }
  .tile .s { color:var(--mute); font-size:10px; }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; flex:none; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
</style></head>
<body><div id="root" class="msg">불러오는 중…</div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 수면(삼성 헬스 수면 카드 모양). 이 하루 범위 안에서 끝난 가장 최근 잠: 길이·시각·수면 점수, 단계 그래프(깸·렘·얕은 잠·깊은 잠)와 단계별 시간.
// 단계는 Health Connect(sleep_stage)를 먼저, 없으면 삼성 헬스 SDK(sh_sleep_stage). 수면 점수는 SDK(sleep_score)에만 있다.
const S = LifeLogSdk, C = S.chart;
const $root = document.getElementById("root");
const msg = (t, sub) => { $root.className = "msg"; $root.innerHTML = S.esc(t) + (sub ? `<br><span class="mute">${S.esc(sub)}</span>` : ""); };
const own = (rows, st) => st.device ? rows.filter(r => r.device === st.device) : rows;
const q = async (view, opts) => (await lifelog.query(view, opts)).rows;
const r1 = x => Math.round(x * 10) / 10;
const num = x => Math.round(x).toLocaleString("ko-KR");
const layout = (parts) => { $root.className = ""; $root.innerHTML = parts; };
const LV = { awake: 0, rem: 1, light: 2, deep: 3 };
const COL = { awake: "#f0a35e", rem: "#5ec8f0", light: "#5b8def", deep: "#3b4fc4", other: "#888" };
const NAME = { awake: "깸", rem: "렘", light: "얕은 잠", deep: "깊은 잠", other: "기타" };
lifelog.ready(async (range, widget) => {
  const st = widget.settings || {};
  const S0 = S.ms(range.start), E0 = S.ms(range.end);
  let rows;
  try { rows = own(await q("health/span", { range: { start: new Date(S0 - 14 * 3600e3).toISOString(), end: range.end }, where: { metric: ["sleep", "sh_sleep", "sleep_stage", "sh_sleep_stage", "sleep_score"] }, limit: 5000 }), st); }
  catch (e) { return msg("읽기 실패: " + e.message); }
  // 날짜 경계(00:00~24:00)로 저장된 옛 행은 실제 잠이 아니므로 뺀다
  const real = r => S.ms(r.end) - S.ms(r.start) < 20 * 3600e3;
  const sessions = rows.filter(r => (r.metric === "sleep" || r.metric === "sh_sleep") && real(r) && S.ms(r.end) > S0 && S.ms(r.end) <= E0).sort((a, b) => S.ms(b.end) - S.ms(a.end));
  if (!sessions.length) return msg("수면 기록 없음", "이 하루 범위 안에서 끝난 잠이 없습니다.");
  const top = sessions[0];
  const sess = sessions.find(r => r.metric === "sleep" && Math.abs(S.ms(r.end) - S.ms(top.end)) < 2 * 3600e3) || top;
  const s0 = S.ms(sess.start), s1 = S.ms(sess.end);
  const inSess = r => S.ms(r.start) >= s0 - 120e3 && S.ms(r.end) <= s1 + 120e3;
  let stages = rows.filter(r => r.metric === "sleep_stage" && inSess(r));
  if (!stages.length) stages = rows.filter(r => r.metric === "sh_sleep_stage" && inSess(r));
  stages.sort((a, b) => S.ms(a.start) - S.ms(b.start));
  const score = rows.filter(r => r.metric === "sleep_score" && real(r) && Math.abs(S.ms(r.end) - s1) < 3 * 3600e3).pop();
  const ms = {}; for (const r of stages) { const k = r.category in LV ? r.category : "other"; ms[k] = (ms[k] || 0) + S.ms(r.end) - S.ms(r.start); }
  const asleep = stages.length ? (s1 - s0) - (ms.awake || 0) : s1 - s0;
  layout('<div class="head"></div><div class="chart"></div><div class="legend"></div>');
  $root.querySelector(".head").innerHTML = `<b>${S.fmtDur(asleep)}</b><span class="mute">${S.fmtTime(s0)}~${S.fmtTime(s1)}${stages.length ? ` · 누운 시간 ${S.fmtDur(s1 - s0)}` : ""}</span>` +
    (score ? `<span>수면 점수 <b style="font-size:18px">${Math.round(score.value)}</b></span>` : "");
  const el = $root.querySelector(".chart"), { W, H } = C.size(el), L = 2, R = 2, T = 4, B = 16, ph = H - T - B, rowH = ph / 4;
  const X = C.scale(s0, s1, L, W - R);
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let i = 0; i <= 4; i++) svg += `<line x1="${L}" x2="${W - R}" y1="${T + i * rowH}" y2="${T + i * rowH}" stroke="var(--line)"/>`;
  if (stages.length) {
    for (const r of stages) {
      const k = r.category in LV ? r.category : "light", y = T + LV[k] * rowH;
      svg += `<rect x="${X(S.ms(r.start)).toFixed(1)}" y="${(y + 2).toFixed(1)}" width="${Math.max(1, X(S.ms(r.end)) - X(S.ms(r.start))).toFixed(1)}" height="${(rowH - 4).toFixed(1)}" rx="2" fill="${COL[k]}"><title>${NAME[k]} ${S.fmtTime(r.start)}~${S.fmtTime(r.end)}</title></rect>`;
    }
  } else svg += `<rect x="${L}" y="${T + 2 * rowH + 2}" width="${W - L - R}" height="${rowH - 4}" rx="3" fill="${COL.light}"/>`;
  for (const tk of C.hourTicks(Math.ceil(s0 / 3600e3) * 3600e3, s1, X, Math.max(1, Math.round((s1 - s0) / 3600e3 / 5)))) svg += `<text x="${tk.x.toFixed(1)}" y="${H - 3}" text-anchor="middle">${C.ampm(tk.t)}</text>`;
  el.innerHTML = svg + "</svg>";
  $root.querySelector(".legend").innerHTML = stages.length ? ["deep", "light", "rem", "awake"].filter(k => ms[k]).map(k => `<span><i style="background:${COL[k]}"></i>${NAME[k]} ${S.fmtDur(ms[k])}</span>`).join("") : '<span class="mute">단계 기록 없음</span>';
});
</script></body></html>

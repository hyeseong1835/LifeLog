<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --fg:#ddd; --mute:#888; --line:#2a2a2a; --tile:#1f1f22; color-scheme: dark; }
  :root[data-theme="light"] { --fg:#1c1c1e; --mute:#6b6b70; --line:#dcdce0; --tile:#f2f2f5; color-scheme: light; }
  html, body { height:100%; }
  body { margin:0; padding:8px 12px; font: 11px/1.3 "Segoe UI Variable", "Segoe UI", sans-serif; color:var(--fg); background:transparent; overflow:hidden; box-sizing:border-box; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap:6px; }
  .tile { background:var(--tile); border-radius:8px; padding:7px 9px; min-height:44px; }
  .tile .k { color:var(--mute); font-size:10px; margin-bottom:2px; }
  .tile .v { font-size:17px; font-weight:600; }
  .tile .v small { font-size:10px; font-weight:400; color:var(--mute); margin-left:2px; }
  .tile .s { color:var(--mute); font-size:10px; }
  .mute { color:var(--mute); }
</style></head>
<body><div id="root" class="mute">불러오는 중…</div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 삼성 헬스 Data SDK로 동기화한 값의 요약 카드. health/span(일별·수면)과 health/point(피부 온도·혈압·체중)를 범위 안에서 읽어 최신 값을 타일로.
// 값은 해석하지 않고 보여만 준다. 스트레스는 SDK에 없다.
const S = LifeLogSdk;
lifelog.ready(async (range, widget) => {
  const st = widget.settings || {};
  const root = document.getElementById("root");
  let spans = [], points = [];
  try {
    spans = (await lifelog.query("health/span", { range, where: { metric: ["energy_score", "sleep_score", "sleep", "sh_sleep", "active_time", "water", "nutrition_kcal", "sh_steps", "steps", "steps_goal"] }, limit: 5000 })).rows;
    points = (await lifelog.query("health/point", { range, where: { metric: ["skin_temperature", "blood_pressure", "body_composition", "sh_body_temp"] }, limit: 20000 })).rows;
  } catch (e) { root.textContent = "읽기 실패: " + e.message; return; }
  if (st.device) { spans = spans.filter(r => r.device === st.device); points = points.filter(r => r.device === st.device); }
  const byMetric = (rows, m, tkey) => rows.filter(r => r.metric === m && r.value != null).sort((a, b) => S.ms(a[tkey]) - S.ms(b[tkey]));
  const lastSpan = (m, cat) => { const l = byMetric(spans, m, "start").filter(r => !cat || r.category === cat); return l[l.length - 1]; };
  const md = t => { const d = new Date(S.ms(t)); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const lastPoint = m => { const l = byMetric(points, m, "time"); return l[l.length - 1]; };
  const tiles = [];
  const tile = (k, v, unit, sub) => tiles.push(`<div class="tile"><div class="k">${k}</div><div class="v">${v}<small>${unit || ""}</small></div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`);
  const r1 = x => Math.round(x * 10) / 10;

  const es = lastSpan("energy_score"); if (es) tile("에너지 점수", Math.round(es.value), "점", md(es.start));
  // 수집기 초기 버전이 올린 수면 점수 행은 start/end가 날짜 경계(00:00, 24시간)라 건너뛴다
  const ss = byMetric(spans, "sleep_score", "start").filter(r => S.ms(r.end) - S.ms(r.start) !== 86400000).pop(); if (ss) tile("수면 점수", Math.round(ss.value), "점", `${S.fmtTime(ss.start)}~${S.fmtTime(ss.end)}`);
  const sl = lastSpan("sleep") || lastSpan("sh_sleep"); if (sl) tile("수면", S.fmtDur(S.ms(sl.end) - S.ms(sl.start)), "", `${S.fmtTime(sl.start)}~${S.fmtTime(sl.end)}`);
  const at = lastSpan("active_time", "daily"); if (at) tile("활동 시간", S.fmtDur(at.value * 60000), "");
  const sp = lastSpan("sh_steps", "daily") || lastSpan("steps", "daily"); const sg = lastSpan("steps_goal");
  if (sp) tile("걸음", Math.round(sp.value).toLocaleString(), "", sg ? `목표 ${Math.round(sg.value).toLocaleString()}` : "");
  const wa = lastSpan("water", "daily"); if (wa) tile("물", Math.round(wa.value), "ml");
  const nu = lastSpan("nutrition_kcal", "daily"); if (nu) tile("섭취", Math.round(nu.value), "kcal");
  const skin = byMetric(points, "skin_temperature", "time");
  if (skin.length) { const vals = skin.map(r => r.value); tile("피부 온도", r1(skin[skin.length - 1].value), "°C", `${r1(Math.min(...vals))}~${r1(Math.max(...vals))} · ${skin.length}회`); }
  const bt = lastPoint("sh_body_temp"); if (bt) tile("체온", r1(bt.value), "°C", S.fmtTime(bt.time));
  const bp = lastPoint("blood_pressure"); if (bp) tile("혈압(수축기)", Math.round(bp.value), "mmHg", S.fmtTime(bp.time));
  const bc = lastPoint("body_composition"); if (bc) tile("체중", r1(bc.value), "kg", S.fmtTime(bc.time));

  if (tiles.length === 0) { root.className = "mute"; root.innerHTML = "이 범위에 삼성 헬스 기록 없음<br><span class=\"mute\">에너지·수면 점수는 삼성 헬스가 계산한 뒤(보통 아침) 다음 1시간 동기화 때 들어옵니다. 계속 비어 있으면 폰 앱에서 삼성 헬스 SDK 권한을 확인하세요.</span>"; return; }
  root.className = ""; root.innerHTML = `<div class="grid">${tiles.join("")}</div>`;
});
</script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --fg:#ddd; --mute:#888; --line:#2a2a2a; --tile:#1f1f22; color-scheme: dark; }
  :root[data-theme="light"] { --fg:#1c1c1e; --mute:#6b6b70; --line:#dcdce0; --tile:#f2f2f5; color-scheme: light; }
  html, body { height:100%; }
  body { margin:0; padding:8px 12px 6px; font: 11px/1.3 "Segoe UI Variable", "Segoe UI", sans-serif; color:var(--fg); background:transparent; overflow:hidden; box-sizing:border-box; }
  #root { display:flex; flex-direction:column; height:100%; gap:4px; }
  #root.msg { display:block; color:var(--mute); }
  .head { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; flex:none; }
  .head b { font-size:22px; font-weight:600; }
  .head .u { font-size:11px; color:var(--mute); margin-left:2px; font-weight:400; }
  .mute { color:var(--mute); }
  .chart { flex:1; min-height:40px; position:relative; }
  .chart svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  text { fill:var(--mute); font-size:10px; }
  .list { overflow:auto; flex:1; min-height:0; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-top:1px solid var(--line); }
  .row .r { text-align:right; white-space:nowrap; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:6px; }
  .tile { background:var(--tile); border-radius:8px; padding:6px 8px; }
  .tile .k { color:var(--mute); font-size:10px; }
  .tile .v { font-size:16px; font-weight:600; }
  .tile .v small { font-size:10px; font-weight:400; color:var(--mute); margin-left:2px; }
  .tile .s { color:var(--mute); font-size:10px; }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; flex:none; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
</style></head>
<body><div id="root" class="msg">불러오는 중…</div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 에너지 점수(삼성 헬스 SDK energy_score)와 수면 점수(sleep_score)의 최근 며칠 추이. 막대 = 에너지, 선 = 수면 점수. 머리에는 이 날의 값.
const S = LifeLogSdk, C = S.chart;
const $root = document.getElementById("root");
const msg = (t, sub) => { $root.className = "msg"; $root.innerHTML = S.esc(t) + (sub ? `<br><span class="mute">${S.esc(sub)}</span>` : ""); };
const own = (rows, st) => st.device ? rows.filter(r => r.device === st.device) : rows;
const q = async (view, opts) => (await lifelog.query(view, opts)).rows;
const r1 = x => Math.round(x * 10) / 10;
const num = x => Math.round(x).toLocaleString("ko-KR");
const layout = (parts) => { $root.className = ""; $root.innerHTML = parts; };
const colorOf = v => v >= 80 ? "#4caf50" : v >= 60 ? "#3fb6a8" : v >= 40 ? "#f0a35e" : "#e57373";
lifelog.ready(async (range, widget) => {
  const st = widget.settings || {}, n = Math.max(3, Math.min(90, Number(st.days) || 14));
  const win = S.daysBack(range, n);
  let rows;
  try { rows = own(await q("health/span", { range: win, where: { metric: ["energy_score", "sleep_score"] }, limit: 2000 }), st); }
  catch (e) { return msg("읽기 실패: " + e.message); }
  const E0 = S.ms(range.end), dayOf = ms => Math.floor((E0 - 1 - ms) / 86400e3);   // 0 = 이 날, 1 = 하루 전…
  const energy = new Map(), sleep = new Map();
  for (const r of rows) {
    if (r.value == null) continue;
    if (r.metric === "energy_score") { const d = dayOf(S.ms(r.start) + 12 * 3600e3); if (d >= 0 && d < n) energy.set(d, r.value); }
    else { const d = dayOf(S.ms(r.end)); if (d >= 0 && d < n) sleep.set(d, r.value); }
  }
  if (!energy.size && !sleep.size) return msg("점수 기록 없음", "삼성 헬스 SDK(read:shealth)가 에너지·수면 점수를 줍니다.");
  layout('<div class="head"></div><div class="chart"></div><div class="legend"></div>');
  const e0 = energy.get(0), s0 = sleep.get(0), avg = m => { const v = [...m.values()]; return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  $root.querySelector(".head").innerHTML = `<span>에너지 <b style="color:${e0 != null ? colorOf(e0) : "inherit"}">${e0 != null ? Math.round(e0) : "–"}</b></span><span>수면 <b>${s0 != null ? Math.round(s0) : "–"}</b></span><span class="mute">${n}일 평균 ${avg(energy) ?? "–"} · ${avg(sleep) ?? "–"}</span>`;
  const el = $root.querySelector(".chart"), { W, H } = C.size(el), L = 2, R = 2, T = 6, B = 16, ph = H - T - B, bw = (W - L - R) / n;
  const Y = C.scale(0, 100, T + ph, T), xOf = d => L + (n - 1 - d) * bw;
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  for (const v of [50, 100]) svg += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
  for (const [d, v] of energy) svg += `<rect x="${(xOf(d) + bw * 0.2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${(T + ph - Y(v)).toFixed(1)}" rx="2" fill="${colorOf(v)}" opacity="${d === 0 ? 1 : 0.75}"><title>${C.md(E0 - (d + 1) * 86400e3 + 1)} 에너지 ${Math.round(v)}</title></rect>`;
  const sp = [...sleep.entries()].sort((a, b) => b[0] - a[0]).map(([d, v]) => ({ x: xOf(d) + bw / 2, y: Y(v), v, d }));
  if (sp.length > 1) svg += `<path d="${C.line(sp)}" fill="none" stroke="#9575cd" stroke-width="2"/>`;
  for (const p of sp) svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#9575cd"><title>수면 점수 ${Math.round(p.v)}</title></circle>`;
  const step = Math.max(1, Math.ceil(n / 7));
  for (let d = 0; d < n; d += step) svg += `<text x="${(xOf(d) + bw / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${C.md(E0 - (d + 1) * 86400e3 + 1)}</text>`;
  el.innerHTML = svg + "</svg>";
  $root.querySelector(".legend").innerHTML = '<span><i style="background:#3fb6a8"></i>에너지 점수</span><span><i style="background:#9575cd"></i>수면 점수</span>';
});
</script></body></html>

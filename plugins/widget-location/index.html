<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  html, body { height:100%; }
  body { margin:0; font: 11px/1.3 "Segoe UI Variable", "Segoe UI", sans-serif; color:#ddd; background:transparent; overflow:hidden; }
  #map { position:relative; width:100%; height:100%; overflow:hidden; background:#1a1a1a; }
  #tiles img { position:absolute; width:256px; height:256px; filter: brightness(.55) saturate(.6); }
  svg { position:absolute; left:0; top:0; }
  .info { position:absolute; left:8px; bottom:6px; color:#bbb; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:4px; }
  .credit { position:absolute; right:6px; bottom:4px; color:#777; font-size:10px; }
  .mute { color:#666; padding:10px; }
</style></head>
<body><div id="map"><div id="tiles"></div></div>
<script src="https://app.lifelog/sdk.js"></script>
<script>
// 위치 점 위젯. phone-location/point를 Web Mercator로 투영해 점·선을 그리고, 설정 map이 켜져 있으면 OpenStreetMap 타일을 배경에 깐다.
// 외부 라이브러리 없이 타일 좌표(z/x/y)를 직접 계산한다. 지도를 끄면 바깥으로 나가는 요청이 없다.
const S = LifeLogSdk;
const TILE = 256;
const lon2x = (lon, z) => (lon + 180) / 360 * Math.pow(2, z) * TILE;
const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z) * TILE; };

lifelog.ready(async (range, widget) => {
  const st = widget.settings || {};
  const useMap = st.map !== false, usePath = st.path !== false, maxAcc = Number(st.max_accuracy) || 500;
  const map = document.getElementById("map"), tiles = document.getElementById("tiles");
  map.querySelectorAll("svg, .info, .credit, .mute").forEach(e => e.remove()); tiles.innerHTML = "";
  let rows = [];
  try { rows = (await lifelog.query("phone-location/point", { range, limit: 5000 })).rows; } catch (e) {}
  rows = rows.filter(r => r.lat != null && r.lon != null && (r.accuracy == null || r.accuracy <= maxAcc)).sort((a, b) => S.ms(a.time) - S.ms(b.time));
  if (rows.length === 0) { map.insertAdjacentHTML("beforeend", '<div class="mute">위치 기록 없음</div>'); return; }
  const W = map.clientWidth || 300, H = map.clientHeight || 240;
  const lats = rows.map(r => r.lat), lons = rows.map(r => r.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons);
  // 모든 점이 들어가는 가장 큰 줌(최대 17)
  let z = 17;
  for (; z > 2; z--) { if (lon2x(maxLon, z) - lon2x(minLon, z) <= W - 40 && lat2y(minLat, z) - lat2y(maxLat, z) <= H - 40) break; }
  const cx = (lon2x(minLon, z) + lon2x(maxLon, z)) / 2, cy = (lat2y(minLat, z) + lat2y(maxLat, z)) / 2;
  const ox = cx - W / 2, oy = cy - H / 2;   // 화면 왼쪽 위의 월드 픽셀 좌표
  if (useMap) {
    const x0 = Math.floor(ox / TILE), x1 = Math.floor((ox + W) / TILE), y0 = Math.floor(oy / TILE), y1 = Math.floor((oy + H) / TILE), n = Math.pow(2, z);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      if (y < 0 || y >= n) continue;
      const img = document.createElement("img");
      img.src = `https://tile.openstreetmap.org/${z}/${((x % n) + n) % n}/${y}.png`;
      img.style.left = (x * TILE - ox) + "px"; img.style.top = (y * TILE - oy) + "px";
      tiles.appendChild(img);
    }
    map.insertAdjacentHTML("beforeend", '<div class="credit">© OpenStreetMap</div>');
  }
  const pts = rows.map(r => ({ x: lon2x(r.lon, z) - ox, y: lat2y(r.lat, z) - oy, r }));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  if (usePath && pts.length > 1) svg += `<polyline points="${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="none" stroke="#6cf" stroke-width="2" stroke-opacity=".7"/>`;
  const t0 = S.ms(range.start), span = S.ms(range.end) - t0;
  for (const p of pts) {
    const hue = 200 + 160 * Math.max(0, Math.min(1, (S.ms(p.r.time) - t0) / span));   // 시간이 갈수록 색이 바뀜
    svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="hsl(${hue} 80% 60%)" stroke="#000" stroke-width="1"><title>${S.fmtTime(p.r.time)}  ±${Math.round(p.r.accuracy || 0)}m</title></circle>`;
  }
  svg += "</svg>";
  map.insertAdjacentHTML("beforeend", svg);
  map.insertAdjacentHTML("beforeend", `<div class="info">${rows.length}개 점 · ${S.fmtTime(rows[0].time)}~${S.fmtTime(rows[rows.length - 1].time)} · z${z}${useMap ? "" : " · 지도 꺼짐"}</div>`);
});
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LifeLog</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#ddd; --mute:#888; --line:#2a2a2a; --accent:#6cf; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.4 "Segoe UI Variable", "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:14px; margin:0 12px 0 0; font-weight:600; }
  button { background:#222; color:var(--fg); border:1px solid #333; border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover { background:#2c2c2c; }
  .date { font-variant-numeric: tabular-nums; min-width: 170px; text-align:center; }
  .spacer { flex:1; }
  main { padding: 8px 40px 40px 12px; overflow-x: hidden; }
  .axis { position:relative; height:18px; margin-left: 180px; color:var(--mute); font-size:11px; overflow:visible; }
  .axis span { position:absolute; transform:translateX(-50%); }
  .lane { display:flex; align-items:stretch; min-height:26px; border-top:1px solid var(--line); }
  .lane .name { width:180px; padding:4px 8px 4px 0; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lane .track { position:relative; flex:1; height:26px; }
  .block { position:absolute; top:4px; height:18px; border-radius:3px; overflow:hidden; font-size:11px; line-height:18px; padding:0 3px; white-space:nowrap; color:#000; }
  .tick { position:absolute; top:2px; width:2px; height:22px; background:var(--accent); }
  .lane.plugin .track { height:auto; }
  .lane.plugin iframe { width:100%; height:120px; border:0; background:transparent; }
  .empty { color:var(--mute); padding:12px 0; }
  .tip { position:fixed; pointer-events:none; background:#000; color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; display:none; z-index:9; max-width:480px; }
  .warn { color:#fc6; }
  .mute { color:var(--mute); }
  #pluginsPage { padding: 12px; }
  #pluginsPage .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #pluginsPage input { background:#1a1a1a; color:var(--fg); border:1px solid #333; border-radius:6px; padding:4px 8px; }
  table.plugins { border-collapse:collapse; margin-top:8px; width:100%; }
  table.plugins th, table.plugins td { text-align:left; vertical-align:top; padding:6px 8px; border-top:1px solid var(--line); font-size:12px; }
  table.plugins th { color:var(--mute); font-weight:500; }
  .chip { display:inline-block; padding:1px 6px; border-radius:10px; font-size:11px; }
  .chip.on { background:#1f4d2a; color:#9f9; } .chip.off { background:#333; color:#aaa; }
</style>
</head>
<body>
<header>
  <h1>LifeLog</h1>
  <button id="prev">◀</button>
  <div class="date" id="date"></div>
  <button id="next">▶</button>
  <button id="today">오늘</button>
  <div class="spacer"></div>
  <span id="info" class="warn"></span>
  <button id="plugins">플러그인</button>
  <button id="reload">새로고침</button>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<section id="pluginsPage" style="display:none"></section>
<div class="tip" id="tip"></div>
<script src="shell.js"></script>
<script src="plugins.js"></script>
</body>
</html>
